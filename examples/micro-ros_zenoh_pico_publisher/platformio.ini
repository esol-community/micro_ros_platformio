; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
#default_envs = m5stack-basic
#default_envs = m5stack-core2
default_envs = m5stack-cores3
#default_envs = m5stack-atoms3

[common]
platform = espressif32
framework = arduino
upload_speed = 2000000
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.8
    m5stack/M5GFX@^0.2.14
    https://github.com/esol-community/micro_ros_platformio#feature/rmw_zenoh_pico

build_flags =
    -DMICRO_ROS_TRANSPORT_UDP
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DARDUINOJSON_USE_LONG_LONG=1
    -DARDUINOJSON_DECODE_UNICODE=1
    -DARDUINOJSON_ENABLE_NAN=1

[env:m5stack-cores3]
platform = ${common.platform}
framework = ${common.framework}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board = m5stack-cores3
board_microros_distro = jazzy
#--- for microxrcedds ---
#board_microros_rmw_impl = rmw_microxrcedds
#board_microros_transport = wifi
#--- for zenoh-pico ---
board_microros_rmw_impl = rmw_zenoh_pico
board_microros_transport = unicast
#board_microros_transport = multicast

lib_deps =
    ${common.lib_deps}
    m5stack/M5CoreS3@^1.0.1
build_flags =
    ${common.build_flags}
    -DBOARD_CORES3=1
    -DUSE_RMW_ZENOH_PICO=1
    -DUSE_ROS_DOMAIN_ID=1
#    -DUSE_ESP32_WIFI_SOFT_AP=1

[env:m5stack-basic]
platform = ${common.platform}
framework = ${common.framework}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board = m5stack-fire
board_microros_distro = jazzy
#--- for microxrcedds ---
#board_microros_rmw_impl = rmw_microxrcedds
#board_microros_transport = wifi
#--- for zenoh-pico ---
board_microros_rmw_impl = rmw_zenoh_pico
board_microros_transport = unicast
#board_microros_transport = multicast

lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DBOARD_BASIC=1
#    -DUSE_RMW_MICROXRCEDDS=1
    -DUSE_RMW_ZENOH_PICO=1
    -DUSE_ROS_DOMAIN_ID=1

